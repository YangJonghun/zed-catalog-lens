[package]
name = "catalog-lens"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"
description = "Language server that resolves pnpm / Yarn / Bun catalog: dependency versions."
publish = false

[[bin]]
name = "catalog-lens"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", default-features = false, features = ["std", "macros"] }
saphyr = { version = "0.3.3", default-features = false }
saphyr-parser = "0.3.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time"] }
tower-lsp-server = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
